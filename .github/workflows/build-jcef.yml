name: Build java-cef

# Builds the native java-cef/CEF bundle for every platform MCEF supports and publishes it as a
# GitHub Release named jcef-<commit>. MCEF downloads from there and only accepts an archive whose
# SHA-256 matches the hash pinned in its jar (mcef-hashes.properties, attached to the release).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux_amd64,   os: ubuntu-22.04,     arch: x86_64 }
          - { name: linux_arm64,   os: ubuntu-22.04-arm, arch: arm64 }
          - { name: windows_amd64, os: windows-2022,     arch: x86_64, msvc: x64 }
          - { name: windows_arm64, os: windows-2022,     arch: arm64,  msvc: amd64_arm64 }
          - { name: macos_amd64,   os: macos-15,         arch: x86_64 }
          - { name: macos_arm64,   os: macos-15,         arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 libgtk-3-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ant # ant builds and bundles jcef_app.app
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Build
        shell: bash
        run: |
          mkdir jcef_build && cd jcef_build
          cmake -G Ninja -DPROJECT_ARCH=${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release ${{ matrix.name }}
          if [ "$RUNNER_OS" = "Linux" ]; then strip ${{ matrix.name }}/libcef.so; fi
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: jcef_build/${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pinned hashes for MCEF
        run: |
          cd dist
          {
            echo "# SHA-256 of each java-cef build; copy into MCEF as common/src/main/resources/mcef-hashes.properties"
            echo "java-cef-commit=${GITHUB_SHA}"
            for f in *.tar.gz; do echo "${f%.tar.gz}=$(sha256sum "$f" | cut -d' ' -f1)"; done
          } > mcef-hashes.properties
          cat mcef-hashes.properties
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jcef-${GITHUB_SHA}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "java-cef ${GITHUB_SHA::7}" \
            --notes "Native java-cef builds for MCEF. Hashes: mcef-hashes.properties"
